<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucine Studio — استوديو إنتاج بصري متخصص في القطاع الطبي</title>
<meta name="description" content="Lucine Studio: وكالة إبداعية متخصصة في صناعة المحتوى الطبي والهوية البصرية للمؤسسات الصحية.">
<link rel="icon" href="assets/logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Poppins:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="#top" class="brand">
      <img src="assets/logo-full.png" alt="Lucine Studio" class="brand-logo">
    </a>
    <nav class="main-nav">
      <a href="#about" data-i18n="nav_about"></a>
      <a href="#services" data-i18n="nav_services"></a>
      <a href="#audience" data-i18n="nav_audience"></a>
      <a href="#form" data-i18n="nav_form"></a>
    </nav>
    <div style="display:flex;align-items:center;gap:14px;">
      <div class="lang-switch" id="langSwitch">
        <button data-lang="ar">AR</button>
        <button data-lang="fr">FR</button>
        <button data-lang="en">EN</button>
      </div>
      <button class="nav-toggle" id="navToggle" aria-label="menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<main id="top">

  <!-- HERO -->
  <section class="hero">
    <img class="hero-shape" id="heroGraphicImg" src="assets/logo-icon.png" alt="">
    <div class="wrap">
      <div class="eyebrow-mark">Lucine Studio</div>
      <h1 data-content="hero_title"></h1>
      <p class="lead" data-content="hero_lead"></p>
      <div class="hero-ctas">
        <a href="#form" class="btn" data-i18n="hero_cta_primary"></a>
        <a href="#services" class="btn ghost" data-i18n="hero_cta_secondary"></a>
      </div>
    </div>
  </section>

  <!-- ABOUT -->
  <section id="about">
    <div class="wrap">
      <div class="section-head">
        <p class="section-tag" data-content="about_title"></p>
        <h2 data-content="hero_title"></h2>
      </div>
      <p class="about-body" data-content="about_body"></p>

      <div class="split-cols">
        <div class="info-panel problem">
          <h3 data-i18n="problem_label"></h3>
          <ul id="problemList"></ul>
        </div>
        <div class="info-panel solution">
          <h3 data-i18n="solution_label"></h3>
          <p style="font-size:14px;color:var(--ink-soft);margin:0 0 16px;" data-content="solution_intro"></p>
          <ul id="solutionList"></ul>
        </div>
      </div>
    </div>
  </section>

  <!-- SERVICES -->
  <section id="services" style="background:var(--cyan-pale);">
    <div class="wrap">
      <div class="section-head">
        <p class="section-tag" data-i18n="services_tag"></p>
        <h2 data-content="about_title"></h2>
      </div>
      <div class="svc-grid" id="serviceGrid"></div>
    </div>
  </section>

  <!-- AUDIENCE -->
  <section id="audience">
    <div class="wrap">
      <div class="section-head">
        <p class="section-tag" data-i18n="audience_tag"></p>
      </div>
      <div class="aud-grid" id="audienceGrid"></div>
    </div>
  </section>

  <!-- FORM -->
  <section id="form" class="form-section">
    <div class="wrap">
      <div class="section-head">
        <p class="section-tag" data-i18n="form_tag"></p>
        <h2 data-content="form_title"></h2>
        <p data-content="form_lead"></p>
      </div>

      <form class="form-shell" id="doctorForm">
        <div class="field">
          <label data-i18n="form_name"></label>
          <input type="text" id="f_name" required>
        </div>
        <div class="field">
          <label data-i18n="form_phone"></label>
          <div class="phone-row">
            <input type="text" id="f_phone_code" class="phone-code" maxlength="5">
            <input type="tel" id="f_phone" required placeholder="555 12 34 56">
          </div>
        </div>
        <div class="field">
          <label data-i18n="form_domain"></label>
          <select id="f_domain"></select>
        </div>
        <div class="field" id="specialtyField" style="display:none;">
          <label data-i18n="form_specialty"></label>
          <select id="f_specialty"></select>
        </div>
        <div class="field">
          <label data-i18n="form_clinic"></label>
          <input type="text" id="f_clinic">
        </div>
        <div class="field">
          <label data-i18n="form_city"></label>
          <select id="f_city"></select>
        </div>
        <div class="field full">
          <label data-i18n="form_message"></label>
          <textarea id="f_message"></textarea>
        </div>
        <div class="field full">
          <button type="submit" class="btn" data-i18n="form_submit"></button>
          <p class="form-note" data-i18n="form_note"></p>
        </div>
      </form>
    </div>
  </section>

</main>

<footer>
  <div class="wrap footer-row">
    <div class="footer-brand">
      <img src="assets/logo-full.png" alt="Lucine Studio" class="brand-logo">
      <span class="footer-copy">© <span id="year"></span> Lucine Studio — <span data-i18n="footer_rights"></span></span>
    </div>
    <div class="social-row" id="socialRow">
      <a href="#" id="socialWhatsapp" target="_blank" rel="noopener" aria-label="WhatsApp">
        <svg viewBox="0 0 24 24"><path d="M12.04 2c-5.5 0-9.96 4.46-9.96 9.96 0 1.76.46 3.48 1.34 5L2 22l5.2-1.36a9.9 9.9 0 0 0 4.84 1.23h.01c5.5 0 9.96-4.46 9.96-9.96S17.55 2 12.04 2zm0 18.15h-.01a8.2 8.2 0 0 1-4.18-1.15l-.3-.18-3.1.81.83-3.02-.2-.31a8.18 8.18 0 1 1 6.96 3.85zm4.47-6.13c-.24-.12-1.44-.71-1.67-.79-.22-.08-.38-.12-.55.12-.16.24-.63.79-.77.95-.14.16-.28.18-.52.06-.24-.12-1.02-.38-1.94-1.2-.72-.64-1.2-1.43-1.34-1.67-.14-.24-.02-.37.11-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.55-1.33-.76-1.82-.2-.48-.4-.42-.55-.42h-.47c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.7 2.6 4.13 3.64.58.25 1.03.4 1.38.51.58.18 1.11.16 1.53.1.47-.07 1.44-.59 1.64-1.15.2-.57.2-1.05.14-1.15-.06-.1-.22-.16-.46-.28z"/></svg>
      </a>
      <a href="#" id="socialInstagram" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24"><path d="M12 2.16c3.2 0 3.58.01 4.85.07 1.17.05 1.8.24 2.22.41.56.21.96.47 1.38.89.42.42.68.82.89 1.38.17.42.36 1.05.41 2.22.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.24 1.8-.41 2.22-.21.56-.47.96-.89 1.38-.42.42-.82.68-1.38.89-.42.17-1.05.36-2.22.41-1.27.06-1.64.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.8-.24-2.22-.41-.56-.21-.96-.47-1.38-.89-.42-.42-.68-.82-.89-1.38-.17-.42-.36-1.05-.41-2.22-.06-1.27-.07-1.65-.07-4.85s.01-3.58.07-4.85c.05-1.17.24-1.8.41-2.22.21-.56.47-.96.89-1.38.42-.42.82-.68 1.38-.89.42-.17 1.05-.36 2.22-.41 1.27-.06 1.65-.07 4.85-.07zM12 0C8.74 0 8.33.01 7.05.07 5.78.13 4.9.33 4.14.63c-.79.31-1.46.72-2.13 1.38C1.35 2.68.94 3.35.63 4.14.33 4.9.14 5.78.07 7.05.01 8.33 0 8.74 0 12s.01 3.67.07 4.95c.06 1.27.26 2.15.56 2.91.31.79.72 1.46 1.38 2.13.66.66 1.34 1.07 2.13 1.38.76.3 1.64.5 2.91.56 1.28.06 1.69.07 4.95.07s3.67-.01 4.95-.07c1.27-.06 2.15-.26 2.91-.56.79-.31 1.46-.72 2.13-1.38.66-.66 1.07-1.34 1.38-2.13.3-.76.5-1.64.56-2.91.06-1.28.07-1.69.07-4.95s-.01-3.67-.07-4.95c-.06-1.27-.26-2.15-.56-2.91a5.9 5.9 0 0 0-1.38-2.13A5.9 5.9 0 0 0 19.86.63c-.76-.3-1.64-.5-2.91-.56C15.67.01 15.26 0 12 0zm0 5.84A6.16 6.16 0 1 0 12 18.16 6.16 6.16 0 0 0 12 5.84zm0 10.16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.41-10.4a1.44 1.44 0 1 1-2.88 0 1.44 1.44 0 0 1 2.88 0z"/></svg>
      </a>
      <a href="#" id="socialFacebook" target="_blank" rel="noopener" aria-label="Facebook">
        <svg viewBox="0 0 24 24"><path d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.78-3.89 1.1 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.89h-2.34v6.99A10 10 0 0 0 22 12z"/></svg>
      </a>
    </div>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/wilayas.js"></script>
<script src="js/main.js"></script>
</body>
</html>
